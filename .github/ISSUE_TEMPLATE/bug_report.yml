name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy text from ...
        2. Press Super+V
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - GNOME extension
        - Daemon
        - Not sure
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: e.g. Fedora 41
    validations:
      required: true
  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: Output of `echo $XDG_SESSION_TYPE`
      options:
        - wayland
        - x11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Extension: `journalctl --user -b /usr/bin/gnome-shell | grep -i winclip`
        Daemon: `journalctl --user -u winclip-daemon -b`
        Please check logs for clipboard contents you don't want to share before posting.
      render: text
